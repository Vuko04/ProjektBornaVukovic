<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Potvrdi lozinku</title>
</head>
<body>
  <h1>Potvrdi lozinku</h1>
  <p>Za ovu akciju moraš ponovno upisati lozinku.</p>

  {% if messages %}
    {% for m in messages %}
      <p style="color:red;">{{ m }}</p>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="password" name="password" placeholder="Lozinka" required>
    <button type="submit">Potvrdi</button>
  </form>


</body>
</html>
