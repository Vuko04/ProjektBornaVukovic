{% extends "base.html" %}
{% block title %}Forma zalihe{% endblock %}
{% block content %}
  <div class="max-w-xl mx-auto bg-white border border-slate-200 rounded-xl p-6">
    <h1 class="text-xl font-bold mb-4">Forma zalihe</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="flex gap-2">
        <button class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold" type="submit">
          Spremi
        </button>
        <a class="px-3 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-sm font-semibold"
           href="{% url 'stockitem_list' %}">
          Odustani
        </a>
      </div>
    </form>
  </div>
{% endblock %}
