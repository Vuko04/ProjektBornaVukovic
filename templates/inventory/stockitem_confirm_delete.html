{% extends "base.html" %}
{% block title %}Brisanje zalihe{% endblock %}
{% block content %}
  <div class="max-w-xl mx-auto bg-white border border-slate-200 rounded-xl p-6">
    <h1 class="text-xl font-bold">Obriši zalihu</h1>
    <p class="text-slate-600 mt-2">
      Jesi siguran da želiš obrisati:
      <b>{{ object.product.name }}</b> @ <b>{{ object.warehouse.name }}</b>?
    </p>

    <form method="post" class="mt-4 flex gap-2">
      {% csrf_token %}
      <button class="px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold" type="submit">
        Da, obriši
      </button>
      <a class="px-3 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-sm font-semibold"
         href="{% url 'stockitem_list' %}">
        Odustani
      </a>
    </form>
  </div>
{% endblock %}
